    risks:
      - what: "Guard, ganti outlet, dan laci tablet potret hanya terbukti lewat widget test; belum pernah dijalankan di Android atau iOS sungguhan"
        severity: medium

  - id: UI-5
    track: ui
    name: Halaman Produk
    goal: "Halaman fitur nyata pertama, sekaligus memasang seluruh perkakas slicing — registry halaman, penyediaan bloc, dan uji asap aplikasi — di layar yang paling murah risikonya"
    status: done
    started_at: 2026-07-27
    completed_at: 2026-08-06
    verification: Daftar/tambah/edit produk terbuka dari AppRoot, terikat outlet aktif, menyimpan pending secara offline, menampilkan kegagalan sync, lolos style enforcer, widget test, dan flutter analyze
    tasks:
      - key: ui5-drop-gallery-route
        title: "Cabut /dev/design dari tabel rute dan tombol galeri dari setiap penanda tempat; galeri tetap hidup lewat entrypoint lib/design_gallery_main.dart, karena nilainya ada pada uji asapnya, bukan pada pintunya di dalam aplikasi"
        status: done
        files: [lib/core/router/app_router.dart, lib/core/constants/app_routes.dart, lib/core/router/route_placeholder.dart, lib/core/router/app_route_guard.dart]
      - key: ui5-test-harness
        title: "Pindahkan uji galeri ke test/core/design/, lalu isi test/widget_test.dart dengan uji asap aplikasi sungguhan di atas AppRoot dan getIt berisi ganda — tanpa .env, Supabase, maupun Hive. Dipasang sekali, dipakai setiap halaman berikutnya"
        status: done
        files: [test/widget_test.dart, test/core/design/design_gallery_smoke_test.dart]
      - key: ui5-page-registry
        title: "Registry pembangun halaman berkunci konstanta AppRoutes; _navRoute memakainya dan jatuh ke RoutePlaceholderPage bila kosong, sehingga tabel rute tetap diturunkan dari AppNavTree dan sebuah halaman bisa lahir tanpa menyentuh tabel rute sama sekali"
        status: done
        files: [lib/core/router/app_page_registry.dart, lib/core/router/app_router.dart]
      - key: ui5-store-id
        title: Alirkan storeId dari AppSession.activeOutlet ke DAO, usecase, dan bloc produk. Hari ini ProductDao tidak menyaring outlet sama sekali, jadi ganti outlet hanya mengganti label di pojok layar sementara katalog kedua outlet tetap tercampur
        status: done
        files: [lib/core/database/daos/product_dao.dart, lib/features/products]
      - key: ui5-product-list
        title: "Halaman /inventory/products di atas AppDataTable, AppSearchField, dan AppPagination; keadaan kosong, memuat, dan galat dibangun sungguhan karena ketiganya yang akan terlihat lebih dulu di database yang masih kosong"
        status: done
        files: [lib/features/products/presentation/pages/product_list_page.dart]
      - key: ui5-product-form
        title: "Satu formulir untuk /inventory/products/new dan /inventory/products/:id; izin PRODUCT_CREATE dan PRODUCT_READ sudah ditetapkan pohon navigasi, formulir tidak memeriksanya lagi sendiri"
        status: done
        files: [lib/features/products/presentation/pages/product_form_page.dart]
      - key: ui5-category-inline
        title: Kategori bisa dibuat dari dalam formulir produk. Tanpa ini produk pertama tidak punya kategori untuk dipilih, dan category_id yang kosong akan menghalanginya didorong ke server nanti
        status: done
        files: [lib/features/categories/presentation]
      - key: ui5-offline-only
        title: "Tegaskan fase ini offline: baris tetap di syncStatus 'pending' dan kegagalan push tampil sebagai toast, bukan diam. SyncWorker berurutan ketat dan berhenti di langkah pertama yang gagal — satu produk yang FK-nya belum ada di server ikut menahan transaksi dan pembayaran, dan satu-satunya gejalanya adalah sinkronisasi yang tidak pernah selesai"
        status: done
        files: [lib/core/sync/sync_bloc, lib/main.dart]
      - key: ui5-features-tokens
        title: Loloskan widget pertama di lib/features/ terhadap no_hardcoded_style_test tanpa menambah pengecualian
        status: done
      - key: ui5-quality-gate
        title: "[Phase Verification & Quality Gate] Verifikasi retroaktif — fase selesai sebelum aturan quality gate berlaku; bukti verifikasi tercatat di field verification fase ini"
        status: done
    decisions:
      - what: Komponen bisnis tidak lagi dibangun sebagai fase tersendiri
        why: "ProductCard menerima entitas Product, jadi ia tidak boleh tinggal di lib/core/design/ yang tidak mengenal domain — dan begitu ia tinggal di lib/features/, ia tidak bisa dipamerkan di galeri. Tidak ada tempat berdiri sendiri untuk keempatnya"
      - what: Sebuah widget naik ke lib/core/design/ hanya setelah fitur kedua memerlukannya dan ia tidak menerima satu pun tipe domain
        why: "Aturan tunggal ini menjawab \"di mana widget ini tinggal\" sekali untuk selamanya, tanpa perdebatan per komponen"
      - what: Produk didahulukan atas kasir
        why: "SyncWorker hanya mendorong, tidak pernah menarik. Basis data lokal lahir kosong dan satu-satunya jalan produk ada adalah dibuat di dalam aplikasi — layar kasir yang dibangun lebih dulu tidak punya apa pun untuk dijual"
      - what: "Tabel rute tidak digandakan; halaman nyata dipasang lewat registry berkunci konstanta AppRoutes"
        why: Menaruh builder di AppNavDestination memaksa app_nav_tree.dart mengimpor 45 halaman fitur, dan pohon itu sengaja dibuat data murni supaya bisa diuji tanpa membangun widget tree
    risks:
      - what: "no_hardcoded_style_test.dart memindai lib/features/ dan gagal keras tanpa daftar pengecualian; widget pertama yang masuk ke sana langsung diuji olehnya, dan formulir produk kemungkinan memerlukan ikon yang belum punya token di AppIcons"
        severity: low
      - what: "storeId disimpan sebagai String di entitas tetapi int di sesi dan bigint di server; toSupabaseJson memakai int.tryParse yang diam-diam menghasilkan null bila nilainya bukan angka"
        severity: medium

