    decisions:
      - what: showGeneralDialog, bukan showDialog
        why: Supaya tirai memakai colors.overlay dan durasinya tunduk pada plafon 220 ms
      - what: Enter di dialog ditangani lewat FocusScope, bukan CallbackShortcuts di dalam panel
        why: Peristiwa papan ketik merambat ke leluhur, dan scope milik rute berada di atas isi dialog
      - what: Checkbox/Radio/Switch digambar sendiri
        why: Versi Material mengambil warna dari ColorScheme, sehingga lepas dari token
      - what: AppDataTable memakai ListView.builder ber-itemExtent
        why: "DataTable Material membangun seluruh baris sekaligus; tabel produk bisa ribuan baris"
      - what: Pengurutan dilaporkan ke pemanggil, tidak dikerjakan tabel sendiri
        why: "Sumber data ada di bloc/DAO; tabel yang mengurut sendiri akan berbeda hasil dari yang di database"
      - what: Ukuran halaman 10 baris ditolak, minimum 25
        why: Sesuai penolakan eksplisit di 16_Design_System.md §16.3
      - what: Enforcer dipasang justru selagi lib/features/ masih kosong dari widget
        why: Kalau menunggu ada widget, daftar pengecualian akan tumbuh lebih dulu dan aturannya jadi tumpul

