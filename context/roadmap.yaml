    verification: "Analyzer bersih; galeri /dev/design terbangun di desktop dan ponsel"
    tasks:
      - key: ui0-tokens
        title: "Token: palette, warna semantik, tipografi, density adaptif, radius, shadow, motion, breakpoint, ikon domain"
        status: done
        files: [lib/core/design/tokens]
      - key: ui0-theme-light
        title: LightScheme lengkap + pemetaan token ke ColorScheme Material agar Dialog/SnackBar/Switch ikut sistem
        status: done
        files: [lib/core/design/theme/light_scheme.dart]
      - key: ui0-primitives
        title: "Delapan primitive stateless: button, text field, panel, badge, divider, empty state, error view, skeleton"
        status: done
        files: [lib/core/design/components]
      - key: ui0-shell
        title: AppShell 4 slot (sidebar/workspace/inspector/bottom-panel), memasang DensityScope untuk seluruh subtree
        status: done
        files: [lib/core/design/components/shell/app_shell.dart]
      - key: ui0-router
        title: GoRouter dengan transisi 220 ms, shell layout, dan galeri /dev/design
        status: done
        files: [lib/core/router]
      - key: ui0-format
        title: Formatter currency (Rp id_ID), number (qty, persen), date (id_ID + relatif)
        status: done
        files: [lib/core/utils]
      - key: ui0-fonts
        title: Inter + JetBrains Mono di-bundle lokal, varian 18pt, angka tabular dijamin di tiap style numerik
        status: done
        files: [assets/fonts]
      - key: ui0-fix-imports
        title: "Perbaiki import 5 model yang menunjuk file *table tak tersedia — proyek tidak bisa dikompilasi sebelumnya"
        status: done
      - key: ui0-tests
        title: Tes invarian token (breakpoint, density, motion), ColorScheme memakai token, galeri terbangun
        status: done
        files: [test/core/design]
      - key: ui0-quality-gate
        title: "[Phase Verification & Quality Gate] Verifikasi retroaktif — fase selesai sebelum aturan quality gate berlaku; bukti verifikasi tercatat di field verification fase ini"
        status: done
    decisions:
      - what: Tipografi disusun per peran, bukan per hierarki
        why: "Layar POS padat; ukuran teks ditentukan tugasnya (harga, label, angka tabel), bukan kedalaman heading"
      - what: Garis lebih diutamakan daripada bayangan
        why: "Tampilan industrial/dense; bayangan menumpuk jadi kotor di layar yang penuh panel"
      - what: Semua motion dibatasi 220 ms
        why: "Kasir mengetuk cepat dan berulang; animasi lebih panjang terasa menghalangi"
      - what: Font di-bundle lokal, bukan diunduh saat runtime
        why: "Aplikasi offline-first; teks tidak boleh menunggu jaringan"
    deferred:
      - to: UI-1
        what: Isi nilai dark_scheme.dart (saat ini masih kerangka berisi TODO)
      - to: UI-2
        what: AppDataTable (25-50 baris)
      - to: UI-11
        what: "Komponen bisnis: ProductCard, CartPanel, PaymentSummary, ReceiptPreview"
      - to: UI-11
        what: Keyboard shortcut F2/F4/ESC/Ctrl+P
      - to: UI-11
        what: Slicing halaman POS

