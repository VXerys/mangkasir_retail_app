  - id: BE-4
    track: be
    name: Kontrak Sinkronisasi Offline
    goal: Membuat push dan pull dua arah yang idempotent, teramati, serta memiliki kebijakan konflik eksplisit untuk perangkat baru maupun perangkat yang lama offline
    status: pending
    verification: "Dua perangkat bertukar master dan transaksi tanpa duplikasi; restart/koneksi putus/retry/konflik lulus; queue dan cursor dapat didiagnosis"
    tasks:
      - key: be4-sync-contract
        title: "Tetapkan envelope sync: entity, operation, idempotency_key, business/outlet, actor, client timestamp, server version, tombstone, retry class, dan error code"
        status: pending
      - key: be4-pull-master
        title: Tarik organization, category, brand, unit, warehouse, tax, product, variant, price, dan barcode ke Drift dengan cursor per scope
        status: pending
      - key: be4-pull-operational
        title: "Tarik customer, supplier, inventory balance/movement, purchase, sales, payment, dan finance sesuai ownership; instalasi baru tidak boleh kosong setelah bootstrap"
        status: pending
      - key: be4-push-idempotent
        title: Push antrean lokal dengan idempotency key server-side, ordering dependency, exponential backoff, dead-letter state, dan retry manual yang aman
        status: pending
      - key: be4-conflicts-deletes
        title: "Tentukan kebijakan konflik per entity dan dukung tombstone/arsip; jangan memakai last-write-wins universal untuk stok, pembayaran, atau status dokumen"
        status: pending
      - key: be4-observability
        title: Sediakan status last sync, queue depth, cursor, error terstruktur, correlation id, dan diagnostic export tanpa membocorkan token atau data sensitif
        status: pending
      - key: be4-two-device-test
        title: "Uji dua perangkat: create/update/delete, offline lama, jam perangkat salah, restart di tengah batch, duplicate delivery, perubahan outlet, dan schema upgrade"
        status: pending
      - key: be4-quality-gate
        title: "[Phase Verification & Quality Gate] Jalankan two-device test lengkap (create/update/delete, offline lama, restart, duplicate delivery, konflik, schema upgrade) tanpa duplikasi atau kehilangan data; queue dan cursor dapat didiagnosis; kumpulkan bukti sebelum fase dinyatakan DONE"
        status: pending
    decisions:
      - what: Konflik transaksi diselesaikan oleh aturan domain, bukan timestamp
        why: "Last-write-wins dapat menghapus pembayaran atau menggandakan stok; command finansial dan inventory bersifat append-only/idempotent"
    risks:
      - what: "Sync dua arah adalah risiko arsitektur tertinggi aplikasi offline-first; jangan menandai fitur operasional production-ready hanya karena push satu arah berhasil"
        severity: high

