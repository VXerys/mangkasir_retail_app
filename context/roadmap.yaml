        status: done
      - key: ui3-gesture
        title: AppSwipeAction, AppRefreshView, AppBackGuard, AppKeyboardInset (juga dipasang di AppDialog dan AppDrawer sempit)
        status: done
        files: [lib/core/design/components/gesture]
      - key: ui3-physical-keyboard
        title: "PhysicalKeyboard menyimpulkan papan ketik fisik dari tombol yang mustahil ada di papan ketik layar; AppShortcutHint"
        status: done
        files: [lib/core/design/components/keyboard]
      - key: ui3-quality-gate
        title: "[Phase Verification & Quality Gate] Verifikasi retroaktif — fase selesai sebelum aturan quality gate berlaku; bukti verifikasi tercatat di field verification fase ini"
        status: done
    decisions:
      - what: 01_Product_Vision_And_Scope.md menang atas 16_Design_System.md §16.1 soal perangkat sasaran
        why: "Vision menetapkan Android/iOS/Web Admin; §16.1 menulis Desktop POS dengan layout ala VS Code. Tidak bisa dua-duanya"
      - what: Heuristik pemindai memakai satu Timer, bukan DateTime.now()
        why: Jam dinding tidak ikut dipercepat FakeAsync, jadi versi pertama mustahil diuji
      - what: AppSwipeAction tidak memakai Dismissible
        why: Dismissible menghapus widgetnya sendiri sebelum bloc sempat memutuskan apakah aksinya jadi
      - what: PopScope, bukan WillPopScope
        why: WillPopScope sudah usang
      - what: Digit dan Enter tidak dihitung sebagai bukti papan ketik fisik
        why: Justru itu yang dikirim pemindai HID, dan pemindai bukan papan ketik
      - what: BarcodeFormat.all ditolak
        why: Dibatasi ke format barcode ritel supaya pendeteksian tidak melambat dan salah baca

