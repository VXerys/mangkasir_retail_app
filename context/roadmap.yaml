      - key: ui4-quality-gate
        title: "[Phase Verification & Quality Gate] Verifikasi retroaktif — fase selesai sebelum aturan quality gate berlaku; bukti verifikasi tercatat di field verification fase ini"
        status: done
    decisions:
      - what: Daftar izin dibaca langsung dari Supabase, tidak dikarang
        why: 26 permission dan 7 peran disalin apa adanya dari tabel role_permissions
      - what: AppSession.can() memegang bypass Owner
        why: "public.has_permission di database mem-bypass Owner lebih dulu; klien yang tidak ikut akan menyembunyikan menu yang justru diizinkan server"
      - what: DevSessionRepository akan dihapus, bukan dikembangkan, saat fase auth tiba
        why: "Ia sengaja dibuat sebagai sekat sementara; mengembangkannya berarti menumpuk logika yang harus dibongkar lagi"
      - what: "Permission Matrix di 15_Screen_Spesification.md salah di empat sel; database yang benar"
        why: "Kasir dinyatakan tidak boleh membuka Product/Inventory/Finance padahal memegang PRODUCT_READ, INVENTORY_VIEW, CASH_VIEW; Manager dinyatakan tidak boleh Settings padahal memegang SETTING_MANAGE"
      - what: DASHBOARD_VIEW yang dirujuk dokumen tidak pernah ada di tabel permissions
    deferred:
